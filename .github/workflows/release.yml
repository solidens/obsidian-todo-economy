name: release

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Проверки
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Версия тега совпадает с manifest
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Тег $TAG не совпадает с версией в manifest.json ($MANIFEST)"
            exit 1
          fi

      - name: Релиз
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Тег могли перевыставить — тогда релиз уже есть, и create падает.
          # Обновляем файлы на месте, вместо того чтобы валить сборку.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
